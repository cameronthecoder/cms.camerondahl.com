{% extends "base.html" %}

{% block content %}
<h1>Sign in</h1>

{% if sent %}
<p>If that email belongs to an admin account, a sign-in link is on its way. Check your inbox.</p>
{% else %}
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Send sign-in link</button>
</form>
{% endif %}
{% endblock %}
